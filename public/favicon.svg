<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#tealGlow)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Audio Waveform Bars behind Mic -->
  <g opacity="0.35" stroke="url(#cyanAccent)" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="28" x2="12" y2="36" />
    <line x1="17" y1="22" x2="17" y2="42" />
    <line x1="47" y1="22" x2="47" y2="42" />
    <line x1="52" y1="28" x2="52" y2="36" />
  </g>

  <!-- Microphone & Stand Group -->
  <g filter="url(#shadow)">
    <!-- Mic Body -->
    <rect x="24" y="14" width="16" height="24" rx="8" fill="url(#tealGlow)" />

    <!-- Mic Mesh Line Accent -->
    <line x1="24" y1="24" x2="40" y2="24" stroke="#0f172a" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Mic Capsule Inner Highlight -->
    <ellipse cx="32" cy="19" rx="5" ry="3" fill="#ffffff" fill-opacity="0.25" />

    <!-- Mic Cradle/U-bracket -->
    <path d="M 20 28 C 20 40, 44 40, 44 28" fill="none" stroke="url(#tealGlow)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mic Stand Stem -->
    <line x1="32" y1="38" x2="32" y2="48" stroke="url(#tealGlow)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mic Base -->
    <line x1="22" y1="48" x2="42" y2="48" stroke="url(#tealGlow)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Pulse Ring Accent (Top Right) -->
  <circle cx="48" cy="16" r="3" fill="#38bdf8" />
  <circle cx="48" cy="16" r="6" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
</svg>
